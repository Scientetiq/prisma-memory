                              - { type: list, ordered: false, items: [{ text: Budget to be confirmed }] }
                              - { type: speaker_notes, paragraphs: [Mention the deadlines.] }
                      warnings: []
                      engine: { id: example-engine, release: example-engine 1.4.2 }
                completed_model_docx_footnote:
                  summary: Model form of a word-processing file with a footnote; no pages, so no anchors
                  value:
                    id: cj_01JBX8V3R6Z1W2X0C9A8J7H6G5
                    state: completed
                    created_at: '2026-11-04T11:00:00Z'
                    started_at: '2026-11-04T11:00:01Z'
                    finished_at: '2026-11-04T11:00:04Z'
                    result:
