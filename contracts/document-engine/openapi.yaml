                              - { type: note, note_kind: footnote, id: '1', text: Renewed automatically. }
                      warnings: []
                      engine: { id: example-engine, release: example-engine 1.4.2 }
                failed_without_result:
                  summary: The conversion process died; class rerun
                  value:
                    id: cj_01JBX4Q9M2V7R8T6Y5W4E3D2C1
                    state: failed
                    created_at: '2026-11-04T10:15:00Z'
                    started_at: '2026-11-04T10:15:04Z'
                    finished_at: '2026-11-04T10:16:10Z'
                    error:
                      type: about:blank
                      title: Conversion process crashed
                      code: converter_crashed
                      class: rerun
                cancelled:
                  value:
                    id: cj_01JBX4Q9M2V7R8T6Y5W4E3D2C1
                    state: cancelled
                    created_at: '2026-11-04T10:15:00Z'
                    started_at: null
                    finished_at: '2026-11-04T10:40:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Throttled' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [conversions]
      operationId: deleteConversion
      summary: Forget the job and its result
      description: |
        Stops the job if it is still queued or running, then forgets the job, its file, its result and its idempotency
        key. Repeating the call is harmless: an unknown id is `404`, which the caller treats as "already forgotten".

        Planned (not current): the core calls `DELETE` after it has applied a result and when a record is purged
        with the id from the `202` body or from `Location` of a `200`.
        A `200` without `Location` from an engine with `async: true` is a contract violation: the core applies the
        result, logs the missing id and relies on `retention_sec`. The core never calls `DELETE` on an engine with
        `async: false`. Today no core code calls it; the DC adapter has no cancel right and writes an `orphan_run`
        journal event instead (`packages/workers/src/jobs/maintenance.ts:1880-1891`).
      responses:
        '204':
          description: Forgotten
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/office-conversions:
    post:
      tags: [office]
      operationId: createOfficeConversion
      summary: Convert a legacy office file to OOXML
      description: |
        Takes a legacy office file and returns the equivalent OOXML file: DOC, RTF and ODT to DOCX; PPT and ODP to PPTX;
        ODS to XLSX. The core's own reader then parses the OOXML, so one
        hidden-content policy applies on every path. Offered only when `capabilities.office_formats` is not
        empty; otherwise `404`.

        Rules: synchronous only; the engine MUST NOT run macros or other active content, MUST NOT use the network, and
        keeps nothing after it has answered.

        **Preservation.** The core applies its hidden-content policy to the
        OOXML it gets back. For every format listed in `capabilities.office_formats`, the conversion MUST keep what that
        policy reads: hidden slides with their hidden state, speaker notes, hidden sheets with their state, hidden rows
        and columns with their hidden state, footnotes and endnotes. It MUST NOT turn content the policy keeps out of
        the text into body text: Word hidden text, Word comments, header and footer parts, document properties, cell
        comments and notes, slide comments. Tracked changes MUST stay tracked or be accepted (insertions kept, deletions
        removed). An engine that cannot meet this for a format MUST NOT list that format, unless it restores the missing
        elements itself before answering. A lost policy element is a defect, never an allowed difference. Planned (not
        current): the document-processing module lists a legacy format only after that format passes the corpus check.

        The answer has no text or units, so a document failure is `422` with an engine failure code, and the
        caller classifies it by the code's class: `encrypted`, `unsupported_format`, `malformed_document`,
        `input_too_large`, `resource_limit` are final; `timeout` (over `deadline_sec`) is `rerun`. This differs from
        `POST /v1/conversions`, where a `422` with a code that is not final is a step error.

        Planned (not current): no code calls or implements this endpoint in this revision.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/OfficeConversionRequest' }
            encoding:
              file:
                contentType: >-
                  application/msword, application/rtf, application/vnd.oasis.opendocument.text,
                  application/vnd.ms-powerpoint, application/vnd.oasis.opendocument.presentation,
                  application/vnd.oasis.opendocument.spreadsheet
            examples:
              doc_to_docx:
                summary: A Word 97–2003 document
                value:
                  file: (binary, sent as 0194f2c3-9f30-7c6d-9e4f-7a8b9c0d1e2f.doc)
                  format: doc
                  deadline_sec: 120
              ods_to_xlsx:
                summary: An OpenDocument spreadsheet
                value:
                  file: (binary, sent as 0194f2c3-a041-7d7e-8f50-8b9c0d1e2f30.ods)
                  format: ods
      responses:
        '200':
          description: The OOXML file. `Content-Type` names the target format.
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document }
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.presentationml.presentation }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The engine does not offer office conversions (`capabilities.office_formats` is empty or absent)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                not_offered:
                  value: { type: about:blank, title: Office conversions are not offered, status: 404, code: not_found }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422':
          description: The file could not be converted. The failure code determines its class.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                encrypted:
                  value: { type: about:blank, title: The file is encrypted, status: 422, code: encrypted, class: terminal }
                timeout:
                  value: { type: about:blank, title: Conversion did not finish in time, status: 422, code: timeout, class: rerun }
        '429': { $ref: '#/components/responses/Throttled' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }

components:
  securitySchemes:
    EngineToken:
      type: http
      scheme: bearer
      bearerFormat: opaque token
      description: |
        A token that the administrator sets in the panel and that the core stores as a secret (planned setting
        `documents.http_token`). Engines compare it in constant time and never log it. A missing or wrong token
        is `401`; a valid token without the right to an operation is `403`. Both mean `config` to the core.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Deterministic key of this submission. The core's key is the first 32 lower-case hex characters of SHA-256 over
        a base derived from the record and the generation or action counter, plus the step. It never includes the attempt number.
        Engines accept any value matching the pattern.
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{16,128}$' }
      example: 3f2a9c7e1b0d4e5f8a6b2c1d0e9f8a7b
    ConversionId:
      name: id
      in: path
      required: true
      description: |
        Job id: the `id` of a `202` body, or the last path segment of `Location` on a `200` from an engine with
        `async: true`
      schema: { $ref: '#/components/schemas/ConversionId' }

  headers:
    RetryAfter:
      description: |
        Seconds to wait before the next request. Engines send an integer number of seconds. The core also accepts an
        HTTP date and caps the value at one day (current DC adapter: `packages/shared/src/converter.ts:168-174`).
      schema: { type: integer, minimum: 0, maximum: 86400 }
    Location:
      description: |
        Path of the job, `/v1/conversions/{id}`: on `202`, and on `200` from an engine with `async: true` (REQUIRED
        there). The core takes the job id for `GET` and `DELETE` from it.
      schema: { type: string, pattern: '^/v1/conversions/[A-Za-z0-9_-]{1,128}$' }
      example: /v1/conversions/cj_01JBX4Q9M2V7R8T6Y5W4E3D2C1

  responses:
    BadRequest:
      description: |
        The request does not match this contract (missing field, unknown recognition policy, policy not offered, bad
        language list). The core treats it as a step error plus mismatch: it means the core and the engine disagree on
        the contract.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            ocr_not_offered:
              value: { type: about:blank, title: Recognition policy not offered, status: 400, code: invalid_request, detail: "ocr=model is not offered; capabilities.ocr.mode is local" }
    Unauthorized:
      description: Token missing or wrong. `config` to the core.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unauthorized:
              value: { type: about:blank, title: Token missing or wrong, status: 401, code: unauthorized }
    Forbidden:
      description: The token is valid but not allowed to call this operation. `config` to the core.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            forbidden:
              value: { type: about:blank, title: Operation not allowed for this token, status: 403, code: forbidden }
    NotFound:
      description: |
        Unknown job id: never created, forgotten after `DELETE`, or expired. On `GET` the core treats it as loss of the
        job; on `DELETE` as "already forgotten".
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            not_found:
              value: { type: about:blank, title: Unknown conversion, status: 404, code: not_found }
    IdempotencyConflict:
      description: The key was already used with a different request. The core treats it as loss of the job.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            idempotency_conflict:
              value: { type: about:blank, title: Key used with a different request, status: 409, code: idempotency_conflict }
    TooLarge:
      description: The file is larger than `capabilities.limits.max_bytes`. Final, too large.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            input_too_large:
              value: { type: about:blank, title: File larger than the engine limit, status: 413, code: input_too_large, class: terminal }
    FileRejected:
      description: |
        The engine rejects the file itself before converting it. Engines speaking this contract use only the eight final
        engine failure codes here (`encrypted`, `unsupported_format`,
        `malformed_document`, `malformed_pdf`, `no_pages`, `input_too_large`, `too_many_pages`, `resource_limit`): the
        core fails the record at once. A `422` with any other code, or without a code, is a step error plus mismatch.
        An engine MAY instead accept the file and report the same code as a result with `status: failed`; the core
        treats both the same.

        Current DC adapter: on a `422`, DC's file rejection codes are final (`packages/shared/src/converter.ts:304-307`,
        `packages/shared/src/converter.ts:612-617`): the eight codes above plus six DC-only codes for password
        protection, a wrong format or quarantine. A size code
        (`packages/shared/src/converter.ts:309`) fails as too large (`packages/shared/src/converter.ts:614-615`); any
        other code is a step error plus mismatch (`packages/shared/src/converter.ts:612-613`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            encrypted:
              value: { type: about:blank, title: The file is encrypted, status: 422, code: encrypted, class: terminal }
            unsupported_format:
              value: { type: about:blank, title: Format not readable by this engine, status: 422, code: unsupported_format, class: terminal }
    Throttled:
      description: |
        The engine is at capacity. The core waits `Retry-After` (clamped to 15 s–15 min; 60 s when absent) without
        spending an attempt and without touching the breaker (current: `packages/shared/src/converter-gate.ts:396`).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            busy:
              value: { type: about:blank, title: Engine at capacity, status: 429, code: busy, retry_after: 120 }
    Unavailable:
      description: |
        The engine cannot serve requests now. The core asks `GET /v1/health`: not OK opens the breaker
        (`unavailable`). An OK probe makes it a document error with its own wait.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unavailable:
              value: { type: about:blank, title: Engine unavailable, status: 503, code: unavailable, retry_after: 30 }
    InternalError:
      description: An engine defect. The core treats any `5xx` other than `502`, `503` and `504` as a step error plus mismatch.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            internal:
              value: { type: about:blank, title: Internal error, status: 500, code: internal }

  schemas:
    DocumentFormat:
      type: string
      description: |
        Formats a document engine may accept. The same list as the core's document formats
        (`packages/shared/src/document-formats.ts:39`); MIME types as in `packages/shared/src/document-formats.ts:52-64`.
      enum: [pdf, docx, doc, odt, rtf, pptx, ppt, odp, xlsx, ods, csv]
    LegacyOfficeFormat:
      type: string
      description: Formats that `POST /v1/office-conversions` turns into OOXML
      enum: [doc, ppt, rtf, odt, ods, odp]
    ContentLocale:
      type: string
      description: Language of the dialect's marker strings listed under Markdown dialect
      enum: [en, ru]
    OcrPolicy:
      type: string
      description: |
        Recognition policy for this conversion: `off` (do not recognise), `local` (a recogniser inside the engine),
        `model` (a recognition model). With the planned recognition set, any
        recognised unit makes extraction `partial` in the core.
      enum: ['off', local, model]
    OcrLanguages:
      type: string
      description: |
        Explicit recognition languages joined with `+`, as three-letter codes with an optional script suffix (for
        example `rus+eng`, `chi_sim`). Automatic language choice is not allowed.
      pattern: '^[a-z]{3}(?:_[a-z]{2,8})?(?:\+[a-z]{3}(?:_[a-z]{2,8})?){0,7}$'
    ConversionId:
      type: string
      description: Opaque job id chosen by the engine
      pattern: '^[A-Za-z0-9_-]{1,128}$'

    Capabilities:
      type: object
      additionalProperties: false
      required: [contract_version, release, formats, ocr, limits, async]
      properties:
        contract_version:
          type: string
          description: Version of this contract that the engine implements, for example `0.1.0`
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$'
        release:
          type: [string, 'null']
          description: Engine build string. The core will store it with each conversion.
          maxLength: 200
        formats:
          type: array
          description: Formats accepted by `POST /v1/conversions`
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/DocumentFormat' }
        office_formats:
          type: array
          description: |
            Formats accepted by `POST /v1/office-conversions`. Absent or empty means the endpoint is not offered.
            Listing a format promises the preservation rules of `POST /v1/office-conversions` for it.
          uniqueItems: true
          items: { $ref: '#/components/schemas/LegacyOfficeFormat' }
        ocr:
          type: object
          additionalProperties: false
          required: [mode, languages]
          properties:
            mode:
              type: string
              description: |
                Recognition the engine offers: `none`, `local` or `model`. The core sends `ocr` = `off` or this mode.
              enum: [none, local, model]
            languages:
              type: array
              description: Language codes the recogniser can use, each usable in `ocr_languages`. Empty when `mode` is `none`.
              uniqueItems: true
              items: { type: string, pattern: '^[a-z]{3}(?:_[a-z]{2,8})?$' }
          if: { properties: { mode: { const: none } } }
          then: { properties: { languages: { maxItems: 0 } } }
        limits:
          type: object
          additionalProperties: false
          required: [max_bytes, max_pages, max_deadline_sec]
          properties:
            max_bytes:
              type: integer
              description: |
                Largest file the engine accepts, in bytes. The core's own intake limit is 20 MiB by default
                (`limits.upload_max_bytes`, `contracts/schema/04-seed.sql:166`).
              minimum: 1
            max_pages:
              type: [integer, 'null']
              description: Most pages or slides the engine converts; null — no own limit
              minimum: 1
            max_deadline_sec:
              type: [integer, 'null']
              description: Longest `deadline_sec` the engine honours; null — no own limit
              minimum: 1
        async:
          type: boolean
          description: |
            Whether the engine may answer `202` with a job. An engine with `async: true` keeps a job for every accepted
            request and names it on `200` too (`Location`); an engine with `async: false` keeps no job.
        idempotency:
          type: object
          additionalProperties: false
          required: [retention_sec]
          properties:
            retention_sec:
              type: integer
              description: |
                How long the engine keeps an idempotency key, its job and its result after the job has finished, in
                seconds, unless the core deletes the job earlier; unfinished jobs are always kept. REQUIRED when `async`
                is true. A `GET` after that time is `404`, which the core treats as loss of the job. The minimum,
                3600 s, covers the longest planned gap between two polls of a running job: a document-error wait of up
                to 1800 s (`packages/shared/src/converter-gate.ts:392`), a poll interval of up to 360 s
                (`packages/workers/src/conversion-rules.ts:52-56`) and a block wait of 5 min
                (`packages/workers/src/jobs/convert.ts:439-440`). A pause has no time limit
                imposed by the core. A job that expires during a pause is handled as loss of the
                job and gets a new generation that counts toward the cycle's resubmission limit.
              minimum: 3600
      if: { properties: { async: { const: true } }, required: [async] }
      then: { required: [idempotency] }

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: '`ok` with HTTP 200; `unavailable` with HTTP 503'
          enum: [ok, unavailable]

    ConversionRequest:
      type: object
      description: |
        Form fields of `POST /v1/conversions`. The core sends only the fields of the contract version that the engine
        reports in `capabilities.contract_version`.
      additionalProperties: false
      required: [file, format, locale, ocr]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: |
            The file. Its part carries an opaque file name `<record id>.<extension>`; engines use at most the extension
            and never log the name.
        format: { $ref: '#/components/schemas/DocumentFormat' }
        locale: { $ref: '#/components/schemas/ContentLocale' }
        ocr: { $ref: '#/components/schemas/OcrPolicy' }
        ocr_languages: { $ref: '#/components/schemas/OcrLanguages' }
        sha256:
          type: string
          description: |
            Hex SHA-256 of the file as the core stored it. Optional; when present, the engine SHOULD verify it
            (mismatch: `400 invalid_request`) and MAY use it to compare repeats of one `Idempotency-Key`.
          pattern: '^[0-9a-f]{64}$'
        text_max_bytes:
          type: integer
          description: |
            Ceiling of the Markdown in UTF-8 bytes; over it the result is `failed` with `resource_limit`. The core sends
            its resolved text cap.
          minimum: 1
        max_pages:
          type: integer
          description: Most pages or slides to convert; over it the result is `failed` with `too_many_pages`
          minimum: 1
        deadline_sec:
          type: integer
          description: |
            Time budget measured in test runs; over it the result or job is `failed` with `timeout`. It is the engine's run
            budget, at most `capabilities.limits.max_deadline_sec`. The core keeps its own watchdog longer than this
            budget. The core has a separate export-wait setting.
          minimum: 1
      allOf:
        - if: { properties: { ocr: { enum: [local, model] } }, required: [ocr] }
          then: { required: [ocr_languages] }

    DocResult:
      type: object
      description: |
        Result in model form. The answer carries neither `markdown` nor `units`. The core
        renders `doc` with its shared renderer, which applies the hidden-content policy and the content locale, and
        derives the units from the containers. `status`, `error`, `warnings` and `engine` mean the same as in
        `NormalizedConversion`. For `status: failed`, `doc` is null and `error` carries the engine failure code. A null
        `error` there means the engine gave no code, and the core uses `conversion_failed`.
      additionalProperties: false
      required: [status, doc, warnings, engine]
      properties:
        status: { $ref: './schemas/NormalizedConversion.json#/$defs/RunStatus' }
        error:
          type: [string, 'null']
          description: Engine failure code. It is absent or null unless `status` is `failed`.
        doc:
          description: The document model; null when `status` is `failed`
          oneOf:
            - $ref: './schemas/DocModel.json'
            - type: 'null'
        warnings:
          type: array
          description: Warning codes for the conversion as a whole
          items: { $ref: './schemas/ConversionUnit.json#/$defs/WarningCode' }
        engine: { $ref: './schemas/NormalizedConversion.json#/$defs/Engine' }
      allOf:
        - if: { properties: { status: { const: failed } }, required: [status] }
          then: { properties: { doc: { type: 'null' } } }
          else: { properties: { error: { type: 'null' }, doc: { type: object } } }
    MarkdownResult:
      description: |
        Result in markdown form as an engine sends it: `NormalizedConversion` (`./schemas/NormalizedConversion.json`)
        without `details`. The adapter that called the engine adds its own details after receiving the answer.
      $ref: './schemas/NormalizedConversion.json'
      not: { required: [details] }
    ConversionResult:
      description: |
        The result of one conversion: markdown form (`MarkdownResult`: `NormalizedConversion` without `details`) or
        model form (`DocResult`). Exactly one form: `markdown` and `doc` never appear together. In the markdown form the
        engine fills `pages` as the number of anchor lines. The core recomputes it from the record text.
        `engine.id` is the engine's own short name; the core replaces it with the id of the adapter that called the
        engine (`http`). Engines MUST NOT send `details` (`MarkdownResult`). It is not a member of this answer: the core
        removes it like any undefined member before it validates (Members of answers) and never stores it. The `http`
        adapter fills `details` only with its own fields, for example the job id from the `202` body or from `Location`
        of a `200`. Engines report no format and no picture count:
        the outcome rules take the engine format from the request `format` (the detected format), and the number of
        pictures from the sum of `units[].images`, or in the model form from the figure blocks of each container.
      oneOf:
        - $ref: '#/components/schemas/MarkdownResult'
        - $ref: '#/components/schemas/DocResult'

    JobState:
      type: string
      description: Job lifecycle for an accepted conversion request
      enum: [queued, running, completed, failed, cancelled]
    ConversionJob:
      type: object
      additionalProperties: false
      required: [id, state, created_at, started_at, finished_at]
      properties:
        id: { $ref: '#/components/schemas/ConversionId' }
        state: { $ref: '#/components/schemas/JobState' }
        created_at:
          type: string
          format: date-time
          description: When the engine accepted the job
        started_at:
          type: [string, 'null']
          format: date-time
          description: When work on the job started; null while `queued`
        finished_at:
          type: [string, 'null']
          format: date-time
          description: When the job reached `completed`, `failed` or `cancelled`
        result:
          $ref: '#/components/schemas/ConversionResult'
        error:
          $ref: '#/components/schemas/Problem'
      allOf:
        - if: { properties: { state: { const: completed } }, required: [state] }
          then: { required: [result], not: { required: [error] } }
        - if: { properties: { state: { const: failed } }, required: [state] }
          then:
            required: [error]
            not: { required: [result] }
            properties: { error: { required: [class], properties: { class: { const: rerun } } } }
        - if: { properties: { state: { enum: [queued, running, cancelled] } }, required: [state] }
          then: { not: { anyOf: [{ required: [result] }, { required: [error] }] } }
        - if: { properties: { state: { enum: [queued, running] } }, required: [state] }
          then: { properties: { finished_at: { type: 'null' } } }
        - if: { properties: { state: { enum: [completed, failed, cancelled] } }, required: [state] }
          then: { properties: { finished_at: { type: string } } }

    OfficeConversionRequest:
      type: object
      description: Form fields of `POST /v1/office-conversions`
      additionalProperties: false
      required: [file, format]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: The legacy office file, with an opaque file name
        format: { $ref: '#/components/schemas/LegacyOfficeFormat' }
        deadline_sec:
          type: integer
          description: Time budget; over it the answer is a problem with code `timeout`
          minimum: 1

    Problem:
      type: object
      description: |
        Error body (`application/problem+json`, RFC 9457). The core reads `code`, the HTTP status and `Retry-After`
        only. `title` and `detail` are for people at the engine side: they MUST NOT contain document text, file names
        or file contents, and the core never logs or stores them. Further members are allowed and ignored.

        `class` is present only with an engine failure code. On `413` and
        `422` answers it is the class of the code in that registry: `terminal` (final), `rerun` (one new run later),
        `job_error` (step error); a failure code outside the registry uses `job_error`. In the `error` of a `failed`
        job it is always present and always `rerun`, whatever the code, because the core treats a failed job as class
        `rerun`. The core derives the class from the registry, the HTTP status and the job state, never from this
        member.

        Codes used by this contract besides the engine failure codes are `invalid_request` (400), `unauthorized` (401),
        `forbidden` (403), `not_found` (404), `idempotency_conflict` (409), `busy` (429), `internal` (500),
        `unavailable` (503).
      required: [code, title]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI; `about:blank` when the code says enough
          default: about:blank
        title:
          type: string
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          format: uri-reference
        code:
          description: Machine code, snake_case
          $ref: './schemas/ConversionUnit.json#/$defs/SnakeCode'
        class:
          type: string
          description: Retry class of an engine failure code
          enum: [terminal, rerun, job_error]
        retry_after:
          type: integer
          description: Same value as the `Retry-After` header, in seconds
          minimum: 0
          maximum: 86400
