                      doc:
                        containers:
                          - kind: file
                            number: null
                            method: ooxml
                            warnings: []
                            blocks:
                              - { type: heading, level: 1, text: Service agreement }
                              - type: paragraph
                                text: [The term is one year, { note_ref: '1' }, .]
