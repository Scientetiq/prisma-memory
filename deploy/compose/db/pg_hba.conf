# Client authentication of the public install path (deploy/compose): baked into the db image as
# /etc/postgresql/pg_hba.conf and used through `-c hba_file=` (the image command), so the file the official entrypoint
# writes into the data folder on its first start is never read.
#   * The superuser postgres is reached only through the unix socket — the folder run/pg that the db service shares
#     with the migrate job, nobody else (deploy/compose/compose.yaml). No TCP line for postgres, loopback included:
#     pg_isready needs no login, and a password is then never a way to the superuser.
#   * The five core roles log in over the db network with scram-sha-256, each only to the databases it uses. Their
#     passwords are the files of the credentials folders; memory-schema sets them on every run.
#   * Everything else is refused: other roles over the socket, any other role, database or address over TCP. The
#     roles of the frozen internal path (authcheck, exporter, intake, reconciler, probe) have no line here.
# TYPE  DATABASE        USER                 ADDRESS          METHOD
local   all             postgres                              trust
host    memory_control  memory_gateway       samenet          scram-sha-256
host    memory_control  memory_worker        samenet          scram-sha-256
host    memory_control  memory_admin_plane   samenet          scram-sha-256
host    memory_open     memory_gateway       samenet          scram-sha-256
host    memory_open     memory_worker        samenet          scram-sha-256
host    memory_closed   memory_gateway       samenet          scram-sha-256
host    memory_closed   memory_worker        samenet          scram-sha-256
host    memory_audit    memory_gateway       samenet          scram-sha-256
host    memory_audit    memory_worker        samenet          scram-sha-256
host    memory_audit    memory_audit_reader  samenet          scram-sha-256
host    memory_audit    memory_audit_maint   samenet          scram-sha-256
local   all             all                                   reject
host    all             all                  all              reject
