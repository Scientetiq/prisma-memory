name: Feature request
description: "Suggest something Prisma Memory should do, or do better"
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: "Who has it, and what they do about it today."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: "What Prisma Memory should do."
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other options
      description: "Other ways to solve it that you thought about."
